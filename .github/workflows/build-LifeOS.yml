 - name: Extract LifeOS Android project
    run: |
      test -f LifeOS_Native_PDF_Picker_GitHub_Build.zip
      unzip -q LifeOS_Native_PDF_Picker_GitHub_Build.zip -d lifeos-project

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: lifeos-project
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LifeOS-debug-apk
      path: lifeos-project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
