
name: Build LifeOS APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LifeOS project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="LifeOS-project-with-my-icon.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/lifeos-source"
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/lifeos-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/lifeos-source" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle found inside the project ZIP."
            find "$RUNNER_TEMP/lifeos-source" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project files verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integrate custom LifeOS icon
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --quiet Pillow

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("app-icon.png")
          if not source.is_file():
              raise SystemExit("app-icon.png is missing from the repository.")

          image = Image.open(source).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          root = Path(__import__("os").environ["PROJECT_DIR"])
          res = root / "app/src/main/res"

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)
              resized = image.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              resized.save(directory / "ic_launcher.png")
              resized.save(directory / "ic_launcher_round.png")

          print("LifeOS launcher icons generated.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
