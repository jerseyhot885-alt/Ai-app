
name: Build LifeOS APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f LifeOS/settings.gradle ] || [ -f LifeOS/settings.gradle.kts ]; then
            echo "PROJECT_DIR=LifeOS" >> "$GITHUB_ENV"
          else
            echo "::error::settings.gradle not found. Upload the Android project files, including settings.gradle, build.gradle and the app folder."
            echo "Repository files:"
            ls -la
            exit 1
          fi

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f build.gradle || test -f build.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app-icon.png
          test -f scripts/generate_launcher_icons.py
          echo "All required LifeOS files found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate custom launcher icons
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_launcher_icons.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
