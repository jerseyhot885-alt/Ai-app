
name: Build LifeOS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate launcher icons from app-icon.png
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("app-icon.png")
          if not source.is_file():
              raise SystemExit(
                  "ERROR: app-icon.png must be in the repository root."
              )

          image = Image.open(source).convert("RGBA")

          # Preserve the complete icon without cropping it.
          side = max(image.width, image.height)
          canvas = Image.new(
              "RGBA", (side, side), (23, 19, 47, 255)
          )
          image.thumbnail((side, side), Image.Resampling.LANCZOS)
          canvas.alpha_composite(
              image,
              ((side - image.width) // 2,
               (side - image.height) // 2)
          )

          root = Path("app/src/main/res")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = canvas.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(
                  folder / "ic_launcher_round.png", optimize=True
              )

          print("Launcher icons generated successfully.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
